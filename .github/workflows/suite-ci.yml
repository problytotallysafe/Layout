name: Suite foundation CI

on:
  push:
    branches: [feature/suite-foundation-20260913, feature/layout-ux-audit-20260917]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layout-suite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://aoypdetctllpaaqryyyt.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_h3LRF9yTw5HxpLOhHQvYJw_bMkPqh8b
      NEXT_PUBLIC_BUILDR_URL: https://buildr-orcin.vercel.app
      NEXT_PUBLIC_AUTH_REDIRECT_URL: https://layout-buildr.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: npm ci
      - name: Suite and offline sync tests
        run: npm run test:suite
      - name: Lint
        run: npm run lint
      - name: Production-style web build
        run: npm run build
      - name: Capacitor Android sync
        run: npx cap sync android
      - name: Android debug build
        run: |
          java -version
          cd android
          ./gradlew assembleDebug
