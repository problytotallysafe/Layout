name: Android release candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  signed-aab:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Browser-safe public values intentionally match Buildr so one account/company
      # identity works across the suite. Never add a Supabase service-role key here.
      NEXT_PUBLIC_SUPABASE_URL: https://aoypdetctllpaaqryyyt.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_h3LRF9yTw5HxpLOhHQvYJw_bMkPqh8b
      NEXT_PUBLIC_BUILDR_URL: https://buildr-orcin.vercel.app
      NEXT_PUBLIC_AUTH_REDIRECT_URL: https://layout-buildr.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - run: npm ci
      - name: Lint web app
        run: npm run lint
      - name: Run suite tests
        run: npm run test:suite
      - name: Verify suite backend configuration
        run: |
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://aoypdetctllpaaqryyyt.supabase.co"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test "$NEXT_PUBLIC_BUILDR_URL" = "https://buildr-orcin.vercel.app"
      - name: Verify release identity
        run: |
          grep -q 'applicationId "com.buildr.layout"' android/app/build.gradle
          grep -q 'versionCode 3' android/app/build.gradle
          grep -q 'versionName "1.0.1"' android/app/build.gradle
      - name: Verify companion-app source permissions
        run: |
          if grep -Eq 'ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|FOREGROUND_SERVICE_LOCATION' android/app/src/main/AndroidManifest.xml; then
            echo 'Layout must not request location/background-location permissions.' >&2
            exit 1
          fi
          ! grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
      - name: Build web assets and sync Android
        run: npm run android:sync
      - name: Verify packaged manifest and Chromebook compatibility
        run: |
          MERGED="android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml"
          if [ ! -f "$MERGED" ]; then
            MERGED=$(find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)
          fi
          if [ -z "$MERGED" ] || [ ! -f "$MERGED" ]; then
            (cd android && chmod +x gradlew && ./gradlew processReleaseMainManifest)
            MERGED=$(find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)
          fi
          test -n "$MERGED" && test -f "$MERGED"
          ! grep -Eq 'android.permission.ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|android.permission.FOREGROUND_SERVICE_LOCATION' "$MERGED"
          ! grep -q 'android.permission.CAMERA' "$MERGED"
          ! grep -q 'android.permission.RECORD_AUDIO' "$MERGED"
          grep -q 'android:scheme="buildr-layout"' "$MERGED"
          python - "$MERGED" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          android = "{http://schemas.android.com/apk/res/android}"
          root = ET.parse(sys.argv[1]).getroot()
          features = {
              node.get(android + "name"): node.get(android + "required", "true")
              for node in root.findall("uses-feature")
          }
          if features.get("android.hardware.touchscreen") != "false":
              raise SystemExit(f"Touchscreen must be optional for ChromeOS: {features.get('android.hardware.touchscreen')!r}")
          activities = root.findall("./application/activity")
          launcher = next((activity for activity in activities if activity.get(android + "name", "").endswith("MainActivity")), None)
          if launcher is None:
              raise SystemExit("MainActivity is missing from the merged manifest")
          if launcher.get(android + "resizeableActivity") != "true":
              raise SystemExit("Layout MainActivity must be resizable on ChromeOS")
          if launcher.get(android + "screenOrientation") not in (None, "unspecified", "-1"):
              raise SystemExit("Layout must not force a phone-only orientation")
          PY
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/layout-release.jks"
      - name: Build signed release bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/layout-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean bundleRelease assembleRelease
        working-directory: android
      - name: Verify AAB signature integrity
        run: |
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab | tee layout-jarsigner-verify.txt
          grep -q 'jar verified.' layout-jarsigner-verify.txt
          apksigner verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk | tee layout-apksigner-verify.txt
      - name: Record bundle metadata
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab Layout-1.0.0-rc.aab
          cp android/app/build/outputs/apk/release/app-release.apk Layout-1.0.0-release.apk
          sha256sum Layout-1.0.0-rc.aab Layout-1.0.0-release.apk > layout-release.sha256
          grep -E 'applicationId|versionCode|versionName' android/app/build.gradle > layout-release-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: layout-1.0.0-release-candidate
          path: |
            Layout-1.0.0-rc.aab
            Layout-1.0.0-release.apk
            layout-release.sha256
            layout-release-version.txt
            layout-jarsigner-verify.txt
            layout-apksigner-verify.txt
          if-no-files-found: error
          retention-days: 14
